spring.application.name=avicole-stock-ia
# ===============================
# H2 DATABASE CONFIG
# ===============================

# Base H2 persistante sur disque pour conserver les donnees entre redemarrages.
spring.datasource.url=jdbc:h2:file:./data/avistock-db;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# ===============================
# SPRING SECURITY
# ===============================

spring.security.user.name=amadou
spring.security.user.password=1234

# ===============================
# JPA / HIBERNATE
# ===============================

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
server.port=8080

# ===============================
# H2 CONSOLE
# ===============================

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
